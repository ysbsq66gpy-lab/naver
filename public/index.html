<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naver Blog Crawler</title>
    <style>
        :root {
            --primary: #03cf5d;
            --dark: #1e1e1e;
            --light: #f5f5f5;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            padding: 0 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #ccc;
        }
        .result-item {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .title:hover {
            text-decoration: underline;
        }
        .date {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }
        .preview {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        #loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Naver Blog Crawler</h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="검색어를 입력하세요 (예: 네이버쇼핑 파트너)" value="네이버쇼핑 파트너 제안">
            <button id="searchBtn">검색하기</button>
        </div>
        <div id="loading">🚀 블로그 본문을 수집하는 중입니다...</div>
        <div id="results"></div>
    </div>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const queryInput = document.getElementById('query');
        const resultsDiv = document.getElementById('results');
        const loading = document.getElementById('loading');

        async function search() {
            const query = queryInput.value;
            if (!query) return;

            searchBtn.disabled = true;
            loading.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:#888;">검색 결과가 없습니다.</p>';
                } else {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <a href="${item.link}" target="_blank" class="title">${item.title}</a>
                            <div class="date">${item.postdate}</div>
                            <div class="preview">${item.preview}...</div>
                        `;
                        resultsDiv.appendChild(div);
                    });
                }
            } catch (err) {
                alert('검색 중 오류가 발생했습니다.');
            } finally {
                searchBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        searchBtn.addEventListener('click', search);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
